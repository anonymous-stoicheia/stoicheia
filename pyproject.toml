[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chardiff-grc"
version = "0.1.0"
description = "CharDiff-grc: a character-level diffusion/masked-LM backbone for Ancient Greek, plus downstream heads for morphological tagging, dependency parsing, meter/macronization, and epigraphic restoration+attribution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Anonymous (under review)" },
]

[tool.setuptools]
packages = [
    "model",
    "data",
    "train",
    "eval",
    "tagger",
    "parser",
    "meter",
    "insc",
    "insc.data",
    "insc.train",
    "insc.eval",
]
